    <!-- Body Highlights -->
    <rect x="-8" y="17" width="2.5" height="13" rx="1.2" fill="#FDE488" />
    <rect x="-8" y="32" width="2.5" height="3" rx="1.2" fill="#FDE488" />
    
    <!-- Metal Band -->
    <rect x="-11" y="36" width="22" height="8" rx="1.5" fill="#B9C6D3" />
    <!-- Indent lines -->
    <rect x="-11" y="38.5" width="22" height="1" fill="#9AAABF" />
    <rect x="-11" y="41.5" width="22" height="1" fill="#9AAABF" />
    
    <!-- Eraser -->
    <path d="M -10,44 L 10,44 L 10,48 C 10,55 -10,55 -10,48 Z" fill="#F4A4B5" />
    <!-- Eraser Highlight -->
    <path d="M -6,47 C -2,46 2,46 6,47" stroke="#F8C6D1" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
